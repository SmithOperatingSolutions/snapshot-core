# snapshot-core CI. Every job here is also reachable locally through
# `mise run ci` (tools/ci), so a red in CI reproduces on a laptop with Go alone.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  static:
    name: fmt · vet (3 OSes) · mod verify · lint · vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      - run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - run: go run ./tools/ci -only fmt,vet,modverify,lint,vuln

  test:
    name: Race suite / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go run ./tools/ci -only race,cover

  s3:
    # The spec's S3-in-CI tier (MinIO in its words; SeaweedFS since MinIO
    # ended its distribution): the S3 backend's contract, concurrent-CAS and
    # probe suites against a real S3-compatible server. REQUIRED=1 turns a
    # missing endpoint into a failure, never a skip (docs/TESTING.md §7).
    name: S3 suites / SeaweedFS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go run ./tools/ci -only s3

  redcheck:
    # Every `test:` commit in the PR must fail, on an assertion, without the
    # commit that implements it (CONTRIBUTING.md). A test that passes against
    # the old code is not testing the change.
    name: red-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go run ./tools/redcheck -base origin/${{ github.base_ref }}
